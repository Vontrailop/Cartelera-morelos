<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0.3"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="2" dy="2" stdDeviation="5" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="600" fill="url(#bgGradient)" rx="20" ry="20"/>
  
  <!-- Event elements -->
  <g transform="translate(100, 100)" filter="url(#shadow)">
    <rect width="200" height="150" fill="#FFFFFF" rx="10" ry="10"/>
    <rect width="180" height="80" x="10" y="10" fill="#4F46E5" rx="5" ry="5"/>
    <text x="100" y="55" font-family="Arial" font-size="16" fill="white" text-anchor="middle">Concierto</text>
    <text x="100" y="110" font-family="Arial" font-size="14" fill="#333" text-anchor="middle">15 Oct</text>
    <text x="100" y="130" font-family="Arial" font-size="12" fill="#666" text-anchor="middle">Cuernavaca</text>
  </g>
  
  <g transform="translate(350, 150)" filter="url(#shadow)">
    <rect width="200" height="150" fill="#FFFFFF" rx="10" ry="10"/>
    <rect width="180" height="80" x="10" y="10" fill="#7C3AED" rx="5" ry="5"/>
    <text x="100" y="55" font-family="Arial" font-size="16" fill="white" text-anchor="middle">Exposición</text>
    <text x="100" y="110" font-family="Arial" font-size="14" fill="#333" text-anchor="middle">22 Oct</text>
    <text x="100" y="130" font-family="Arial" font-size="12" fill="#666" text-anchor="middle">Museo de Arte</text>
  </g>
  
  <g transform="translate(500, 300)" filter="url(#shadow)">
    <rect width="200" height="150" fill="#FFFFFF" rx="10" ry="10"/>
    <rect width="180" height="80" x="10" y="10" fill="#3B82F6" rx="5" ry="5"/>
    <text x="100" y="55" font-family="Arial" font-size="16" fill="white" text-anchor="middle">Teatro</text>
    <text x="100" y="110" font-family="Arial" font-size="14" fill="#333" text-anchor="middle">30 Oct</text>
    <text x="100" y="130" font-family="Arial" font-size="12" fill="#666" text-anchor="middle">Centro Cultural</text>
  </g>
  
  <g transform="translate(150, 350)" filter="url(#shadow)">
    <rect width="200" height="150" fill="#FFFFFF" rx="10" ry="10"/>
    <rect width="180" height="80" x="10" y="10" fill="#EC4899" rx="5" ry="5"/>
    <text x="100" y="55" font-family="Arial" font-size="16" fill="white" text-anchor="middle">Festival</text>
    <text x="100" y="110" font-family="Arial" font-size="14" fill="#333" text-anchor="middle">5 Nov</text>
    <text x="100" y="130" font-family="Arial" font-size="12" fill="#666" text-anchor="middle">Parque Central</text>
  </g>
  
  <!-- Calendar icon -->
  <g transform="translate(650, 100)">
    <rect width="100" height="120" fill="#FFFFFF" rx="10" ry="10" stroke="#3B82F6" stroke-width="3"/>
    <rect width="100" height="30" fill="#3B82F6" rx="10" ry="10"/>
    <text x="50" y="20" font-family="Arial" font-size="14" fill="white" text-anchor="middle">OCT</text>
    <text x="50" y="70" font-family="Arial" font-size="36" fill="#3B82F6" text-anchor="middle">15</text>
  </g>
  
  <!-- Decorative elements -->
  <circle cx="50" cy="50" r="20" fill="#4F46E5" opacity="0.5"/>
  <circle cx="750" cy="550" r="30" fill="#7C3AED" opacity="0.5"/>
  <circle cx="700" cy="250" r="15" fill="#3B82F6" opacity="0.5"/>
  <circle cx="100" cy="500" r="25" fill="#EC4899" opacity="0.5"/>
</svg>