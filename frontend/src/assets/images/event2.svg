<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradient2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0.9"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="300" fill="url(#bgGradient2)"/>
  
  <!-- Art elements -->
  <g transform="translate(200, 150)">
    <!-- Canvas -->
    <rect x="-100" y="-80" width="200" height="160" fill="white" stroke="#333" stroke-width="5"/>
    
    <!-- Easel -->
    <line x1="-120" y1="-100" x2="-120" y2="80" stroke="#5B21B6" stroke-width="8"/>
    <line x1="120" y1="-100" x2="120" y2="80" stroke="#5B21B6" stroke-width="8"/>
    <line x1="-120" y1="-100" x2="120" y2="-100" stroke="#5B21B6" stroke-width="8"/>
    <line x1="-120" y1="80" x2="120" y2="80" stroke="#5B21B6" stroke-width="8"/>
    
    <!-- Abstract art on canvas -->
    <circle cx="-50" cy="-30" r="30" fill="#EF4444"/>
    <rect x="20" y="-60" width="60" height="60" fill="#3B82F6"/>
    <polygon points="0,20 -40,60 40,60" fill="#10B981"/>
  </g>
  
  <!-- Event title -->
  <rect x="50" y="220" width="300" height="50" fill="rgba(0,0,0,0.5)" rx="5" ry="5"/>
  <text x="200" y="250" font-family="Arial" font-size="18" fill="white" text-anchor="middle">Exposición de Arte Contemporáneo</text>
</svg>