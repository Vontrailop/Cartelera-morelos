<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradient3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EC4899" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#DB2777" stop-opacity="0.9"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="300" fill="url(#bgGradient3)"/>
  
  <!-- Theater elements -->
  <g transform="translate(200, 150)">
    <!-- Stage -->
    <rect x="-150" y="-20" width="300" height="100" fill="#4B5563"/>
    <rect x="-150" y="-20" width="300" height="20" fill="#1F2937"/>
    
    <!-- Curtains -->
    <path d="M-150,-100 Q-120,-50 -150,80" fill="#9D174D" stroke="#9D174D" stroke-width="5"/>
    <path d="M-120,-100 Q-90,-40 -120,80" fill="#9D174D" stroke="#9D174D" stroke-width="5"/>
    <path d="M-90,-100 Q-60,-30 -90,80" fill="#9D174D" stroke="#9D174D" stroke-width="5"/>
    
    <path d="M150,-100 Q120,-50 150,80" fill="#9D174D" stroke="#9D174D" stroke-width="5"/>
    <path d="M120,-100 Q90,-40 120,80" fill="#9D174D" stroke="#9D174D" stroke-width="5"/>
    <path d="M90,-100 Q60,-30 90,80" fill="#9D174D" stroke="#9D174D" stroke-width="5"/>
    
    <!-- Actors -->
    <circle cx="-50" cy="20" r="25" fill="#F9A8D4"/>
    <circle cx="50" cy="20" r="25" fill="#A78BFA"/>
    <rect x="-60" y="45" width="20" height="30" fill="#F9A8D4"/>
    <rect x="40" y="45" width="20" height="30" fill="#A78BFA"/>
  </g>
  
  <!-- Event title -->
  <rect x="50" y="220" width="300" height="50" fill="rgba(0,0,0,0.5)" rx="5" ry="5"/>
  <text x="200" y="250" font-family="Arial" font-size="18" fill="white" text-anchor="middle">Teatro en el Centro Histórico</text>
</svg>